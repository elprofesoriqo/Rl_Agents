env:
  name: "CarRacing-v3"
  render_mode: null
  frame_stack: 4
  frame_skip: 4
  img_size: [84, 84]
  grayscale: true
  normalize: true
  discrete_actions: true
  reward_shaping: true
  max_episode_steps: 1000
  
  reward_shaper_type: "curriculum"
  progress_reward_weight: 1.5
  speed_reward_weight: 0.2
  position_reward_weight: 0.8
  steering_reward_weight: 0.15
  lap_completion_bonus: 150.0
  crash_penalty: -10.0
  off_track_penalty: -1.0
  adaptation_episodes: 400

network:
  hidden_dims: [512, 256]
  activation: "relu"
  use_batch_norm: false
  dropout_rate: 0.0
  init_method: "orthogonal"

ppo:
  learning_rate: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coeff: 0.5
  entropy_coeff: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 4
  batch_size: 64
  mini_batch_size: 32

training:
  total_timesteps: 10000000
  n_parallel_envs: 4
  rollout_steps: 512
  save_interval: 100000
  eval_interval: 50000
  eval_episodes: 5
  mixed_precision: true
  gradient_checkpointing: true

hpc:
  device: "cuda"
  num_workers: 8
  pin_memory: true
  non_blocking: true
  compile_model: true
  distributed: false
  world_size: 1
  rank: 0
  backend: "nccl"
  
  # HCP optimizations
  channels_last: true
  cuda_graphs: true
  gradient_accumulation: 1
  fused_optimizer: true
  tensorcore_precision: "mixed"

replay_buffer:
  capacity: 20000
  batch_size: 32
  min_size: 10000
  buffer_type: "prioritized"
  alpha: 0.7
  beta_start: 0.5
  beta_steps: 100000
  epsilon: 1e-6

  gpu_buffer: false     

logging:
  log_dir: "logs/hcp"
  tensorboard: true
  excel: true
  console_level: "DEBUG"
  file_level: "DEBUG"
  save_videos: true
  video_interval: 10000
  profiler: true        
