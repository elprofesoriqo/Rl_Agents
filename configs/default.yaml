env:
  name: "CarRacing-v2"
  render_mode: null
  frame_stack: 4
  frame_skip: 4
  img_size: [84, 84]
  grayscale: true
  normalize: true
  discrete_actions: true
  reward_shaping: true
  max_episode_steps: 1000
  
  # Advanced reward shaping parameters
  reward_shaper_type: "basic"  # "basic", "adaptive", "curriculum"
  progress_reward_weight: 1.0
  speed_reward_weight: 0.1
  position_reward_weight: 0.5
  steering_reward_weight: 0.1
  lap_completion_bonus: 100.0
  crash_penalty: -10.0
  off_track_penalty: -1.0
  adaptation_episodes: 1000  # For adaptive shaper

network:
  hidden_dims: [512, 256]
  activation: "relu"
  use_batch_norm: false
  dropout_rate: 0.0
  init_method: "orthogonal"

ppo:
  learning_rate: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coeff: 0.5
  entropy_coeff: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 10
  batch_size: 64
  mini_batch_size: 32

training:
  total_timesteps: 1000000
  n_parallel_envs: 8
  rollout_steps: 2048
  save_interval: 10000
  eval_interval: 5000
  eval_episodes: 10
  mixed_precision: true
  gradient_checkpointing: false

hpc:
  device: "cuda"
  num_workers: 4
  pin_memory: true
  non_blocking: true
  compile_model: true
  distributed: false
  world_size: 1
  rank: 0
  backend: "nccl"

replay_buffer:
  # Buffer settings
  capacity: 100000
  batch_size: 32
  min_size: 1000
  buffer_type: "prioritized"  # "prioritized" or "uniform"
  
  # Prioritized replay settings
  alpha: 0.6  # How much prioritization is used (0 = uniform, 1 = full prioritization)
  beta_start: 0.4  # Initial importance sampling correction factor
  beta_steps: 100000  # Number of steps to anneal beta to 1.0
  epsilon: 1e-6  # Small constant to prevent zero priorities
  
  # GPU optimization
  gpu_buffer: true  # Store buffer on GPU for performance

logging:
  log_dir: "logs"
  tensorboard: true
  excel: true
  console_level: "INFO"
  file_level: "DEBUG"
  save_videos: true
  video_interval: 10000
